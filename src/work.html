<!doctype html>
<!--
  Redirect stub. /work was an unlinked legacy index page (the nav's WORK link
  goes to /untitled-film/) but Google had it indexed, so serving a bare 404
  would just leave a dead result in search for weeks.

  GitHub Pages cannot issue a real 301, so this is the documented fallback: an
  instant meta refresh plus a canonical pointing at the home page. Google treats
  a zero-delay refresh as a soft redirect and consolidates the URL into the
  canonical target. The inline script makes it immediate for real visitors, who
  never see this page.

  No layout on purpose — pulling in layout.njk would render the full nav and
  background for a page nobody is meant to look at.

  The original page content is in git history: git show 51e7c7c:src/work.html
  Excluded from collections so it stays out of sitemap.xml.
-->
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Redirecting — Lilan Yang</title>
	<link rel="canonical" href="https://lilanyang.studio/">
	<meta http-equiv="refresh" content="0; url=/">
	<script>window.location.replace("/");</script>
	<style>
		body {
			background: #000;
			color: #fff;
			font-family: Gotham, "Helvetica Neue", Helvetica, Arial, sans-serif;
			font-weight: bold;
			margin: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px;
		}

		a {
			color: #ffcc33;
		}
	</style>
</head>

<body>
	<p>This page has moved. <a href="/">Go to lilanyang.studio</a>.</p>
</body>

</html>
